<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html dir="ltr" lang="pt-BR">

<head>
  <meta content="text/html; charset=UTF-8" http-equiv="Content-Type" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="x-apple-disable-message-reformatting" />
</head>

<body style="margin: 0; padding: 0; background-color: #0f0f12; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">

  <!-- Wrapper -->
  <table border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #0f0f12;">
    <tr>
      <td align="center" style="padding: 40px 16px;">

        <!-- Card -->
        <table border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 560px; background-color: #1a1a24; border-radius: 12px; overflow: hidden; border: 1px solid #2a2a3a;">

          <!-- Header -->
          <tr>
            <td style="background: linear-gradient(135deg, #7c3aed 0%, #3b82f6 100%); padding: 32px 40px; text-align: center;">
              <table border="0" cellpadding="0" cellspacing="0" width="100%">
                <tr>
                  <td align="center">
                    <div style="width: 48px; height: 48px; background-color: rgba(255,255,255,0.2); border-radius: 50%; margin: 0 auto 16px; line-height: 48px; font-size: 24px;">
                      &#9993;
                    </div>
                    <h1 style="margin: 0; color: #ffffff; font-size: 20px; font-weight: 600; letter-spacing: -0.3px;">
                      Nova mensagem do portfolio
                    </h1>
                    <p style="margin: 8px 0 0; color: rgba(255,255,255,0.7); font-size: 14px;">
                      Alguem precheu o formulario de contato
                    </p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding: 32px 40px;">

              <!-- Info cards -->
              <table border="0" cellpadding="0" cellspacing="0" width="100%">
                <!-- Nome -->
                <tr>
                  <td style="padding-bottom: 16px;">
                    <table border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #22222e; border-radius: 8px; border: 1px solid #2a2a3a;">
                      <tr>
                        <td style="padding: 14px 16px;">
                          <p style="margin: 0 0 4px; color: #8b8ba3; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600;">
                            Nome
                          </p>
                          <p style="margin: 0; color: #e4e4ef; font-size: 15px; font-weight: 500;">
                            {{name}}
                          </p>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>

                <!-- Email -->
                <tr>
                  <td style="padding-bottom: 16px;">
                    <table border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #22222e; border-radius: 8px; border: 1px solid #2a2a3a;">
                      <tr>
                        <td style="padding: 14px 16px;">
                          <p style="margin: 0 0 4px; color: #8b8ba3; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600;">
                            Email
                          </p>
                          <p style="margin: 0; font-size: 15px;">
                            <a href="mailto:{{email}}" style="color: #818cf8; text-decoration: none; font-weight: 500;">
                              {{email}}
                            </a>
                          </p>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>

                <!-- Assunto -->
                <tr>
                  <td style="padding-bottom: 24px;">
                    <table border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #22222e; border-radius: 8px; border: 1px solid #2a2a3a;">
                      <tr>
                        <td style="padding: 14px 16px;">
                          <p style="margin: 0 0 4px; color: #8b8ba3; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600;">
                            Assunto
                          </p>
                          <p style="margin: 0; color: #e4e4ef; font-size: 15px; font-weight: 500;">
                            {{subject}}
                          </p>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>

              <!-- Divider -->
              <table border="0" cellpadding="0" cellspacing="0" width="100%">
                <tr>
                  <td style="padding-bottom: 24px;">
                    <div style="height: 1px; background-color: #2a2a3a;"></div>
                  </td>
                </tr>
              </table>

              <!-- Mensagem -->
              <table border="0" cellpadding="0" cellspacing="0" width="100%">
                <tr>
                  <td>
                    <p style="margin: 0 0 12px; color: #8b8ba3; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600;">
                      Mensagem
                    </p>
                    <table border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #22222e; border-radius: 8px; border-left: 3px solid #7c3aed;">
                      <tr>
                        <td style="padding: 20px;">
                          <p style="margin: 0; color: #c4c4d4; font-size: 14px; line-height: 1.7; white-space: pre-wrap;">{{message}}</p>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>

              <!-- Reply button -->
              <table border="0" cellpadding="0" cellspacing="0" width="100%">
                <tr>
                  <td align="center" style="padding-top: 28px;">
                    <a href="mailto:{{email}}?subject=Re: {{subject}}" style="display: inline-block; background: linear-gradient(135deg, #7c3aed 0%, #3b82f6 100%); color: #ffffff; text-decoration: none; padding: 12px 32px; border-radius: 8px; font-size: 14px; font-weight: 600; letter-spacing: 0.2px;">
                      Responder
                    </a>
                  </td>
                </tr>
              </table>

            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="background-color: #16161f; padding: 20px 40px; border-top: 1px solid #2a2a3a;">
              <table border="0" cellpadding="0" cellspacing="0" width="100%">
                <tr>
                  <td align="center">
                    <p style="margin: 0; color: #55556a; font-size: 12px;">
                      Enviado pelo formulario de contato do portfolio
                    </p>
                    <p style="margin: 6px 0 0; color: #55556a; font-size: 12px;">
                      Guilherme Menezes &bull; Desenvolvedor Full-Stack
                    </p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

        </table>
        <!-- Fim Card -->

      </td>
    </tr>
  </table>
  <!-- Fim Wrapper -->

</body>
</html>
