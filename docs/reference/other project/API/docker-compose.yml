services:
  # Backend API
  tb-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BUILD_TIMESTAMP=${BUILD_TIMESTAMP}
        - BUILD_VERSION=${BUILD_VERSION}
    container_name: tb-api
    restart: unless-stopped
    labels:
      - "com.docker.compose.project=tb-portifolio"
      - "com.docker.compose.service=tb-api"
    tty: true
    stdin_open: true
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:-change-this-secret-key}
      - FRONTEND_URL=${FRONTEND_URL:-http://168.138.134.26:8080}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@thiagobahls.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
    volumes:
      # Persistir banco de dados
      - /srv/minecraft/tb-portifolio/api/data:/app/data
      # Persistir uploads
      - /srv/minecraft/tb-portifolio/api/uploads:/app/uploads
      # Logs do backend
      - /srv/minecraft/tb-portifolio/api/logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - tb-portfolio-network

  # Frontend
  tb-frontend:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
        - BUILD_TIMESTAMP=${BUILD_TIMESTAMP}
        - BUILD_VERSION=${BUILD_VERSION}
    container_name: tb-frontend
    restart: unless-stopped
    labels:
      - "com.docker.compose.project=tb-portifolio"
      - "com.docker.compose.service=tb-frontend"
    ports:
      - "8080:80"
    volumes:
      # Logs do frontend (nginx)
      - /srv/minecraft/tb-portifolio/api/logs/nginx:/var/log/nginx
    depends_on:
      - tb-api
    networks:
      - tb-portfolio-network
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --quiet --tries=1 --spider http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  tb-portfolio-network:
    driver: bridge
    name: tb-portfolio-network

